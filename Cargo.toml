[package]
name = "nlopt4r"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Dense nonlinear optimization algorithms in pure Rust"
readme = "README.md"
repository = "https://github.com/qchen-fdii-cardc/nlopt"
documentation = "https://docs.rs/nlopt4r"
keywords = ["optimization", "nonlinear", "numerical", "pure-rust", "solver"]
categories = ["mathematics", "science"]

[dependencies]
nalgebra = "0.34"

[dev-dependencies]
nlopt = "0.8.1"

[[test]]
name = "nlopt_comparison"
path = "tests/nlopt/main.rs"
