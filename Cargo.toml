[package]
name = "nlopt4r"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Pure-Rust nonlinear optimization with local, global and constrained solvers"
readme = "README.md"
repository = "https://github.com/qchen-fdii-cardc/nlopt4r"
documentation = "https://docs.rs/nlopt4r"
keywords = ["optimization", "nonlinear", "numerical", "pure-rust", "solver"]
categories = ["mathematics", "science"]

[dependencies]
nalgebra = "0.34"
rand = { version = "0.9", default-features = false, features = ["std"] }
rand_chacha = "0.9"

[workspace]
members = ["tools/nlopt-reference", "tools/extension", "tools/bench"]
default-members = ["."]
resolver = "3"

[dev-dependencies]
criterion = "0.5"

[[bench]]
name = "kernels"
harness = false
